<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 1. Título descriptivo -->
    <title>Mi Sitio Web - Inicio</title>

    <!-- 2. Versión válida de Bootstrap CSS (Bootstrap 5.3.3) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

    <!-- 3. Barra de navegación con botón responsive (hamburger) y logo/marca -->
    <header>
        <nav class="navbar navbar-expand-md navbar-dark bg-primary shadow-sm">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html">Mi Sitio</a>
                
                <!-- Botón para desplegar menú en pantallas pequeñas -->
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Alternar navegación">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="index.html">Inicio</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="columnas.html">Columnas</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="imagen.html">Imagen</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link disabled" href="#" tabindex="-1" aria-disabled="true">Deshabilitado</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- 4. Contenido principal envuelto en <main> -->
    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8 text-center">
                <h1 class="mb-4 text-primary">Video Destacado</h1>
                
                <!-- 5. Video de YouTube 100% adaptable/responsive -->
                <div class="ratio ratio-16x9 shadow rounded overflow-hidden">
                    <iframe src="https://www.youtube.com/embed/n_7HZB-rAbY?si=RFeMsTcJsVdMowUU"
                        title="Reproductor de video de YouTube"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        referrerpolicy="strict-origin-when-cross-origin" 
                        allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </main>

    <!-- 6. Pie de página opcional para cerrar correctamente la estructura -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small>&copy; 2026 Mi Sitio Web. Todos los derechos reservados.</small>
        </div>
    </footer>

    <!-- Bootstrap JS (al final del body para mejor carga) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
